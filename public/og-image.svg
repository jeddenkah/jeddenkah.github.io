<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2025" />
      <stop offset="50%" stop-color="#18191D" />
      <stop offset="100%" stop-color="#0F1012" />
    </linearGradient>

    <!-- Atmosphere Light Glows -->
    <radialGradient id="glowBlue" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#415EEE" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#415EEE" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGreen" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#31CE01" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#31CE01" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="200" cy="150" r="400" fill="url(#glowBlue)" />
  <circle cx="1000" cy="500" r="450" fill="url(#glowGreen)" />

  <!-- Outer Card Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="32" fill="rgba(255, 255, 255, 0.03)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Top Badge / Laurel -->
  <g transform="translate(100, 110)">
    <rect width="480" height="38" rx="19" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <circle cx="24" cy="19" r="5" fill="#31CE01" />
    <text x="38" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#EBF0F8" letter-spacing="1.5">ASTRA OTOPARTS &bull; MES &bull; SYSTEM INTEGRATOR</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="220" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">
    Ifen Faridian Rahmadan
  </text>

  <text x="100" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="28" font-weight="600" fill="#415EEE">
    Expert Industrial Engineer &amp; Fullstack System Integrator
  </text>

  <text x="100" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-size="20" font-weight="400" fill="#A0A5B5">
    Engineering intelligent factories, MES, IoT telemetry, AI Agents &amp; cloud architectures.
  </text>

  <!-- Tech Badges Row -->
  <g transform="translate(100, 385)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="150" height="42" rx="12" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="75" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Svelte 5 &amp; TS</text>

    <!-- Pill 2 -->
    <rect x="162" y="0" width="150" height="42" rx="12" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="237" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Smart Factory</text>

    <!-- Pill 3 -->
    <rect x="324" y="0" width="160" height="42" rx="12" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="404" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">YOLO &amp; AI Agents</text>

    <!-- Pill 4 -->
    <rect x="496" y="0" width="160" height="42" rx="12" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.1)" />
    <text x="576" y="26" font-family="sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">OT/IT Integration</text>
  </g>

  <!-- Bottom Metric Bar -->
  <g transform="translate(100, 480)">
    <line x1="0" y1="0" x2="1000" y2="0" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

    <text x="0" y="35" font-family="sans-serif" font-size="22" font-weight="700" fill="#31CE01">99.9% Availability</text>
    <text x="0" y="55" font-family="sans-serif" font-size="12" font-weight="500" fill="#808595">Server Target Uptime</text>

    <text x="280" y="35" font-family="sans-serif" font-size="22" font-weight="700" fill="#415EEE">100% Digital</text>
    <text x="280" y="55" font-family="sans-serif" font-size="12" font-weight="500" fill="#808595">IT &amp; OT Integration</text>

    <text x="540" y="35" font-family="sans-serif" font-size="22" font-weight="700" fill="#FFCA00">Telkom Univ</text>
    <text x="540" y="55" font-family="sans-serif" font-size="12" font-weight="500" fill="#808595">3.86 Cum Laude</text>

    <text x="820" y="35" font-family="sans-serif" font-size="18" font-weight="600" fill="#FFFFFF">jeddenkah.github.io</text>
    <text x="820" y="55" font-family="sans-serif" font-size="12" font-weight="500" fill="#808595">GitHub Pages Hosted</text>
  </g>
</svg>
